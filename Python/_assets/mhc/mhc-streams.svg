<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570">
<title>从一条残差流，到多条完整的特征流</title><desc>C 表示每条流的特征维度；下图使用 n = 4。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#65758b"/></marker></defs>
<rect width="960" height="570" rx="18" fill="#f6f8fc"/>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172b45} .small{font-size:18px;fill:#52647b}</style>
<text x="36" y="49" font-size="27" font-weight="700">从一条残差流，到多条完整的特征流</text>
<text x="36" y="83" class="small">C 表示每条流的特征维度；下图使用 n = 4。</text>
<text x="48" y="136" text-anchor="start" style="fill:#172b45" font-size="21">普通残差</text>
<rect x="48" y="194" width="130" height="62" rx="12" fill="#e9f0ff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="113.0" y="218.0" text-anchor="middle" style="fill:#172b45" font-size="20">输入 x</text>
<text x="113.0" y="246.0" text-anchor="middle" style="fill:#172b45" font-size="20">C 维</text>
<rect x="330" y="220" width="230" height="70" rx="12" fill="#e5f5ee" stroke="#8ec9ab" stroke-width="1.5"/>
<text x="445.0" y="262.0" text-anchor="middle" style="fill:#172b45" font-size="18">Norm + Attention/FFN</text>
<rect x="640" y="194" width="64" height="62" rx="12" fill="#ffffff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="672.0" y="232.0" text-anchor="middle" style="fill:#172b45" font-size="29">+</text>
<rect x="780" y="194" width="132" height="62" rx="12" fill="#e9f0ff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="846.0" y="218.0" text-anchor="middle" style="fill:#172b45" font-size="20">输出 y</text>
<text x="846.0" y="246.0" text-anchor="middle" style="fill:#172b45" font-size="20">C 维</text>
<polyline points="178,225 240,225 240,255 330,255" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="240,225 240,167 672,167 672,194" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="445" y="154" text-anchor="middle" style="fill:#172b45" font-size="18">输入直接传递</text>
<polyline points="560,255 605,255 605,225 640,225" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="704,225 780,225" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="36" y1="320" x2="924" y2="320" stroke="#d4dfed"/>
<text x="48" y="356" text-anchor="start" style="fill:#172b45" font-size="21">四流结构</text>
<rect x="48" y="379" width="140" height="29" rx="12" fill="#dae7ff" stroke="#dae7ff" stroke-width="1.5"/>
<text x="118.0" y="400.5" text-anchor="middle" style="fill:#172b45" font-size="17">流 1 · C 维</text>
<rect x="772" y="379" width="140" height="29" rx="12" fill="#dae7ff" stroke="#dae7ff" stroke-width="1.5"/>
<text x="842.0" y="400.5" text-anchor="middle" style="fill:#172b45" font-size="17">流 1 · C 维</text>
<rect x="48" y="415" width="140" height="29" rx="12" fill="#e5e2ff" stroke="#e5e2ff" stroke-width="1.5"/>
<text x="118.0" y="436.5" text-anchor="middle" style="fill:#172b45" font-size="17">流 2 · C 维</text>
<rect x="772" y="415" width="140" height="29" rx="12" fill="#e5e2ff" stroke="#e5e2ff" stroke-width="1.5"/>
<text x="842.0" y="436.5" text-anchor="middle" style="fill:#172b45" font-size="17">流 2 · C 维</text>
<rect x="48" y="451" width="140" height="29" rx="12" fill="#d9f0eb" stroke="#d9f0eb" stroke-width="1.5"/>
<text x="118.0" y="472.5" text-anchor="middle" style="fill:#172b45" font-size="17">流 3 · C 维</text>
<rect x="772" y="451" width="140" height="29" rx="12" fill="#d9f0eb" stroke="#d9f0eb" stroke-width="1.5"/>
<text x="842.0" y="472.5" text-anchor="middle" style="fill:#172b45" font-size="17">流 3 · C 维</text>
<rect x="48" y="487" width="140" height="29" rx="12" fill="#ffe8d0" stroke="#ffe8d0" stroke-width="1.5"/>
<text x="118.0" y="508.5" text-anchor="middle" style="fill:#172b45" font-size="17">流 4 · C 维</text>
<rect x="772" y="487" width="140" height="29" rx="12" fill="#ffe8d0" stroke="#ffe8d0" stroke-width="1.5"/>
<text x="842.0" y="508.5" text-anchor="middle" style="fill:#172b45" font-size="17">流 4 · C 维</text>
<rect x="308" y="399" width="344" height="94" rx="12" fill="#e5f5ee" stroke="#8ec9ab" stroke-width="1.5"/>
<text x="480.0" y="439.0" text-anchor="middle" style="fill:#172b45" font-size="20">读取 → 一次子层计算 → 写回</text>
<text x="480.0" y="467.0" text-anchor="middle" style="fill:#172b45" font-size="20">同时混合原有的四条流</text>
<polyline points="188,447 308,447" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="652,447 772,447" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="480" y="544" text-anchor="middle" style="fill:#172b45" font-size="20">总状态宽度 4C；Attention/FFN 的输入宽度仍是 C。</text>
</svg>