<rect x="490" y="805" width="350" height="70" rx="12" fill="#fff0da" stroke="#d8b27d" stroke-width="1.5"/>
<text x="665.0" y="847.0" text-anchor="middle" style="fill:#172b45" font-size="20">Cross-entropy loss</text>
<polyline points="665,755 665,805" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="330,722 395,722 395,840 490,840" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="480" y="927" text-anchor="middle" style="fill:#172b45" font-size="19">loss.backward() → Attention、FFN、mHC 参数的梯度 → optimizer.step()</text>
</svg>