<svg xmlns="http://www.w3.org/2000/svg" width="960" height="980" viewBox="0 0 960 980">
<title>从 token 到 loss：mHC 放进训练计算图</title><desc>B：批次　T：序列长度　n：流数　C：隐藏宽度　V：词表大小</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#65758b"/></marker></defs>
<rect width="960" height="980" rx="18" fill="#f6f8fc"/>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172b45} .small{font-size:18px;fill:#52647b}</style>
<text x="36" y="49" font-size="27" font-weight="700">从 token 到 loss：mHC 放进训练计算图</text>
<text x="36" y="83" class="small">B：批次　T：序列长度　n：流数　C：隐藏宽度　V：词表大小</text>
<rect x="70" y="130" width="260" height="65" rx="12" fill="#e9f0ff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="200.0" y="169.5" text-anchor="middle" style="fill:#172b45" font-size="20">token ID · [B,T]</text>
<rect x="70" y="240" width="260" height="75" rx="12" fill="#e9f0ff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="200.0" y="270.5" text-anchor="middle" style="fill:#172b45" font-size="20">Embedding + 位置</text>
<text x="200.0" y="298.5" text-anchor="middle" style="fill:#172b45" font-size="20">[B,T,C]</text>
<rect x="70" y="360" width="260" height="75" rx="12" fill="#e9f0ff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="200.0" y="390.5" text-anchor="middle" style="fill:#172b45" font-size="20">复制为 n 条流</text>
<text x="200.0" y="418.5" text-anchor="middle" style="fill:#172b45" font-size="20">[B,T,n,C]</text>
<polyline points="200,195 200,240" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="200,315 200,360" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="440" y="130" width="450" height="405" rx="15" fill="#f2f0fa" stroke="#b8a8e0" stroke-width="2"/>
<text x="665" y="170" text-anchor="middle" style="fill:#172b45" font-size="23">一个 Transformer 块</text>
<rect x="490" y="205" width="350" height="115" rx="12" fill="#e5f5ee" stroke="#8ec9ab" stroke-width="1.5"/>
<text x="665.0" y="241.5" text-anchor="middle" style="fill:#172b45" font-size="19">Attention 侧 mHC</text>
<text x="665.0" y="269.5" text-anchor="middle" style="fill:#172b45" font-size="19">pre → Norm + 因果 Attention</text>
<text x="665.0" y="297.5" text-anchor="middle" style="fill:#172b45" font-size="19">res 混合 + post 写回</text>
<rect x="490" y="375" width="350" height="115" rx="12" fill="#e5f5ee" stroke="#8ec9ab" stroke-width="1.5"/>
<text x="665.0" y="411.5" text-anchor="middle" style="fill:#172b45" font-size="19">FFN 侧 mHC</text>
<text x="665.0" y="439.5" text-anchor="middle" style="fill:#172b45" font-size="19">pre → Norm + FFN</text>
<text x="665.0" y="467.5" text-anchor="middle" style="fill:#172b45" font-size="19">res 混合 + post 写回</text>
<polyline points="330,398 395,398 395,262 490,262" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="665,320 665,375" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="690" y="353" text-anchor="start" style="fill:#172b45" font-size="18">[B,T,n,C]</text>
<polyline points="665,490 665,574" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="490" y="574" width="350" height="65" rx="12" fill="#e9f0ff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="665.0" y="613.5" text-anchor="middle" style="fill:#172b45" font-size="20">后续块 · [B,T,n,C]</text>
