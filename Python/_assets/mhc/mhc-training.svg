<rect x="490" y="680" width="350" height="75" rx="12" fill="#e9f0ff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="665.0" y="710.5" text-anchor="middle" style="fill:#172b45" font-size="20">沿流平均 + Norm + LM head</text>
<text x="665.0" y="738.5" text-anchor="middle" style="fill:#172b45" font-size="20">logits · [B,T,V]</text>
<rect x="70" y="690" width="260" height="65" rx="12" fill="#e9f0ff" stroke="#9bb6df" stroke-width="1.5"/>
