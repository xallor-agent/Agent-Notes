<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680">
<title>一层 mHC：混合旧信息，再写入新更新</title><desc>蓝色：原有状态　绿色：子层更新　紫色：生成映射系数</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#65758b"/></marker></defs>
<rect width="960" height="680" rx="18" fill="#f6f8fc"/>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172b45} .small{font-size:18px;fill:#52647b}</style>
<text x="36" y="49" font-size="27" font-weight="700">一层 mHC：混合旧信息，再写入新更新</text>
<text x="36" y="83" class="small">蓝色：原有状态　绿色：子层更新　紫色：生成映射系数</text>
<rect x="55" y="136" width="165" height="80" rx="12" fill="#e9f0ff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="137.5" y="169.0" text-anchor="middle" style="fill:#172b45" font-size="20">输入 X</text>
<text x="137.5" y="197.0" text-anchor="middle" style="fill:#172b45" font-size="20">n × C</text>
<rect x="318" y="128" width="370" height="96" rx="12" fill="#eee9ff" stroke="#b8a8e0" stroke-width="1.5"/>
<text x="503.0" y="169.0" text-anchor="middle" style="fill:#172b45" font-size="20">归一化 + 线性投影 + 约束</text>
<text x="503.0" y="197.0" text-anchor="middle" style="fill:#172b45" font-size="20">根据当前 X 生成 p、R、q</text>
<polyline points="220,176 318,176" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="322" y="280" width="220" height="76" rx="12" fill="#e9f0ff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="432.0" y="311.0" text-anchor="middle" style="fill:#172b45" font-size="20">res：R × X</text>
<text x="432.0" y="339.0" text-anchor="middle" style="fill:#172b45" font-size="20">n × C</text>
<rect x="78" y="431" width="166" height="76" rx="12" fill="#e9f0ff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="161.0" y="462.0" text-anchor="middle" style="fill:#172b45" font-size="20">pre：p × X</text>
<text x="161.0" y="490.0" text-anchor="middle" style="fill:#172b45" font-size="20">C 维</text>
<rect x="318" y="431" width="224" height="76" rx="12" fill="#e5f5ee" stroke="#8ec9ab" stroke-width="1.5"/>
<text x="430.0" y="462.0" text-anchor="middle" style="fill:#172b45" font-size="18">Norm + Attention/FFN</text>
<text x="430.0" y="490.0" text-anchor="middle" style="fill:#172b45" font-size="18">一次计算 · C 维</text>
<rect x="618" y="431" width="174" height="76" rx="12" fill="#e5f5ee" stroke="#8ec9ab" stroke-width="1.5"/>
<text x="705.0" y="462.0" text-anchor="middle" style="fill:#172b45" font-size="20">post：q × u</text>
<text x="705.0" y="490.0" text-anchor="middle" style="fill:#172b45" font-size="20">n × C</text>
<rect x="820" y="287" width="74" height="62" rx="12" fill="#ffffff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="857.0" y="325.0" text-anchor="middle" style="fill:#172b45" font-size="30">+</text>
<rect x="764" y="555" width="160" height="76" rx="12" fill="#e9f0ff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="844.0" y="586.0" text-anchor="middle" style="fill:#172b45" font-size="20">输出 Y</text>
<text x="844.0" y="614.0" text-anchor="middle" style="fill:#172b45" font-size="20">n × C</text>
<polyline points="137,216 137,318 322,318" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="137,318 137,431" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="542,318 820,318" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="244,469 318,469" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="542,469 618,469" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="792,469 857,469 857,349" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="894,318 936,318 936,532 844,532 844,555" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="400,224 400,280" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<text x="416" y="260" text-anchor="middle" style="fill:#7754af" font-size="20">R</text>
<polyline points="318,195 268,195 268,402 175,402 175,431" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<text x="252" y="385" text-anchor="middle" style="fill:#7754af" font-size="20">p</text>
<polyline points="688,195 715,195 715,431" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<text x="735" y="390" text-anchor="middle" style="fill:#7754af" font-size="20">q</text>
<text x="55" y="587" text-anchor="start" style="fill:#172b45" font-size="26">Y = R × X + q × u</text>
<text x="55" y="628" text-anchor="start" style="fill:#172b45" font-size="19">虚线传递系数；实线传递特征。</text>
</svg>