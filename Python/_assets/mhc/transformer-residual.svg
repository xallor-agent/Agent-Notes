<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
<title>Transformer 中的两条残差路径</title><desc>Pre-Norm 示例：Attention 和 FFN 分别在已有状态上添加更新。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#65758b"/></marker></defs>
<rect width="960" height="620" rx="18" fill="#f6f8fc"/>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172b45} .small{font-size:18px;fill:#52647b}</style>
<text x="36" y="49" font-size="27" font-weight="700">Transformer 中的两条残差路径</text>
<text x="36" y="83" class="small">Pre-Norm 示例：Attention 和 FFN 分别在已有状态上添加更新。</text>
<text x="48" y="138" text-anchor="start" style="fill:#172b45" font-size="21">第一次：上下文更新</text>
<rect x="48" y="207" width="100" height="70" rx="12" fill="#e9f0ff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="98.0" y="235.0" text-anchor="middle" style="fill:#172b45" font-size="20">输入 x</text>
<text x="98.0" y="263.0" text-anchor="middle" style="fill:#172b45" font-size="20">C 维</text>
<rect x="228" y="233" width="130" height="64" rx="12" fill="#eee9ff" stroke="#b8a8e0" stroke-width="1.5"/>
<text x="293.0" y="272.0" text-anchor="middle" style="fill:#172b45" font-size="20">Norm 1</text>
<rect x="422" y="233" width="164" height="64" rx="12" fill="#e5f5ee" stroke="#8ec9ab" stroke-width="1.5"/>
<text x="504.0" y="272.0" text-anchor="middle" style="fill:#172b45" font-size="20">Attention</text>
<rect x="670" y="207" width="64" height="70" rx="12" fill="#ffffff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="702.0" y="249.0" text-anchor="middle" style="fill:#172b45" font-size="29">+</text>
<rect x="800" y="207" width="112" height="70" rx="12" fill="#e9f0ff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="856.0" y="235.0" text-anchor="middle" style="fill:#172b45" font-size="20">状态 h</text>
<text x="856.0" y="263.0" text-anchor="middle" style="fill:#172b45" font-size="20">C 维</text>
<polyline points="148,242 184,242 184,265 228,265" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="358,265 422,265" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="586,265 625,265 625,242 670,242" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="184,242 184,177 702,177 702,207" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="440" y="163" text-anchor="middle" style="fill:#172b45" font-size="18">旁路保存 x</text>
<polyline points="734,242 800,242" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="48" y="362" text-anchor="start" style="fill:#172b45" font-size="21">第二次：特征变换</text>
<rect x="48" y="431" width="100" height="70" rx="12" fill="#e9f0ff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="98.0" y="459.0" text-anchor="middle" style="fill:#172b45" font-size="20">状态 h</text>
<text x="98.0" y="487.0" text-anchor="middle" style="fill:#172b45" font-size="20">C 维</text>
<rect x="228" y="457" width="130" height="64" rx="12" fill="#eee9ff" stroke="#b8a8e0" stroke-width="1.5"/>
<text x="293.0" y="496.0" text-anchor="middle" style="fill:#172b45" font-size="20">Norm 2</text>
<rect x="422" y="457" width="164" height="64" rx="12" fill="#e5f5ee" stroke="#8ec9ab" stroke-width="1.5"/>
<text x="504.0" y="496.0" text-anchor="middle" style="fill:#172b45" font-size="20">FFN / MoE</text>
<rect x="670" y="431" width="64" height="70" rx="12" fill="#ffffff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="702.0" y="473.0" text-anchor="middle" style="fill:#172b45" font-size="29">+</text>
<rect x="800" y="431" width="112" height="70" rx="12" fill="#e9f0ff" stroke="#9bb6df" stroke-width="1.5"/>
<text x="856.0" y="459.0" text-anchor="middle" style="fill:#172b45" font-size="20">输出 y</text>
<text x="856.0" y="487.0" text-anchor="middle" style="fill:#172b45" font-size="20">C 维</text>
<polyline points="148,466 184,466 184,489 228,489" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="358,489 422,489" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="586,489 625,489 625,466 670,466" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="184,466 184,401 702,401 702,431" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="440" y="387" text-anchor="middle" style="fill:#172b45" font-size="18">旁路保存更新后的 h</text>
<polyline points="734,466 800,466" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="856,277 856,326 25,326 25,466 48,466" fill="none" stroke="#65758b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="480" y="580" text-anchor="middle" style="fill:#172b45" font-size="20">两次相加都要求：子层输出与对应旁路的形状一致。</text>
</svg>